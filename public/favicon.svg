<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Subtle neural grid lines -->
  <path d="M12 20H52M12 44H52M20 12V52M44 12V52" stroke="#38BDF8" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Stylized Geometric Cyber 'S' with Neural Circuit Aesthetic -->
  <!-- Top bar & curve -->
  <path d="M46 19H24C19.58 19 16 22.58 16 27C16 31.42 19.58 35 24 35H40C44.42 35 48 38.58 48 43C48 47.42 44.42 51 40 51H18" 
        stroke="url(#cyberNeon)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Circuit nodes / Synaptic endpoints -->
  <circle cx="46" cy="19" r="3.5" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="18" cy="51" r="3.5" fill="#C084FC" filter="url(#glow)" />
  <circle cx="32" cy="35" r="2.5" fill="#FFFFFF" />

  <!-- Diagonal high-tech accent pulse -->
  <circle cx="48" cy="23" r="1.5" fill="#38BDF8" opacity="0.8" />
  <circle cx="16" cy="47" r="1.5" fill="#818CF8" opacity="0.8" />
</svg>
